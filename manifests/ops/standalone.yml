---
# Single-node evaluation deployment. No erasure coding, no data
# redundancy — use external backup.
- type: replace
  path: /instance_groups/name=rustfs/instances
  value: 1

- type: replace
  path: /instance_groups/name=rustfs/azs
  value: [z1]

- type: replace
  path: /instance_groups/name=rustfs/networks
  value:
  - name: default

- type: replace
  path: /instance_groups/name=smoke-tests/networks
  value:
  - name: default
