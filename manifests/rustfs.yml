---
name: rustfs

releases:
- name: rustfs
  version: latest
- name: bpm
  version: latest

stemcells:
- alias: default
  os: ubuntu-noble
  version: latest

update:
  canaries: 1
  max_in_flight: 1
  serial: true
  canary_watch_time: 5000-120000
  update_watch_time: 5000-120000

instance_groups:
- name: rustfs
  instances: 4
  azs: [z1, z2, z3]
  vm_type: rustfs
  stemcell: default
  persistent_disk_type: rustfs
  env:
    persistent_disk_fs: xfs
  networks:
  - name: rustfs
  jobs:
  - name: bpm
    release: bpm
  - name: rustfs-server
    release: rustfs
    properties:
      rustfs:
        access_key: ((rustfs_access_key))
        secret_key: ((rustfs_secret_key))

- name: smoke-tests
  lifecycle: errand
  instances: 1
  azs: [z1]
  vm_type: rustfs
  stemcell: default
  networks:
  - name: rustfs
  jobs:
  - name: smoke-tests
    release: rustfs
    properties:
      rustfs:
        access_key: ((rustfs_access_key))
        secret_key: ((rustfs_secret_key))
