---
name: rustfs

releases:
- name: rustfs
  version: latest
# bpm is pinned because "latest" picks whatever the director holds, and
# bpm 1.4.31 cannot start any process on a noble (cgroup v2) stemcell.
# manifests/ops/resolute.yml replaces this pin with 1.4.41.
- name: bpm
  version: 1.4.22
  url: https://bosh.io/d/github.com/cloudfoundry/bpm-release?v=1.4.22
  sha1: sha256:51f2eab4b59939db733beb8f7905e461a732cc29d85e54f151f576cd5bf0c414

# Link addresses must be IP addresses, because the peers dial each other by
# them and the API certificate names them.  With DNS addresses, every
# peer URL would carry a BOSH DNS name instead.
features:
  use_dns_addresses: false

stemcells:
- alias: default
  os: ubuntu-noble
  version: latest

update:
  canaries: 1
  max_in_flight: 1
  serial: true
  # post-start waits for a rejoining node to become ready, and drain waits
  # for the other peers before a node stops, so allow ten minutes.
  canary_watch_time: 30000-600000
  update_watch_time: 30000-600000

instance_groups:
- name: rustfs
  # The node count is fixed at the first deploy, because RustFS cannot grow
  # or shrink a formed cluster in place.  A cluster needs three or more.
  instances: 3
  azs: [z1, z2, z3]
  vm_type: rustfs
  stemcell: default
  persistent_disk_type: rustfs
  env:
    persistent_disk_fs: xfs
  networks:
  - name: rustfs
  jobs:
  - name: bpm
    release: bpm
  - name: rustfs-server
    release: rustfs
    properties:
      rustfs:
        access_key: ((rustfs_access_key))
        secret_key: ((rustfs_secret_key))

- name: smoke-tests
  lifecycle: errand
  instances: 1
  azs: [z1]
  vm_type: rustfs
  stemcell: default
  networks:
  - name: rustfs
  jobs:
  - name: smoke-tests
    release: rustfs
    properties:
      rustfs:
        access_key: ((rustfs_access_key))
        secret_key: ((rustfs_secret_key))
