name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create BOSH Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "${GITHUB_OUTPUT}"

      - name: Install bosh-cli
        run: |
          BOSH_VERSION=$(curl -s https://api.github.com/repos/cloudfoundry/bosh-cli/releases/latest \
            | jq -r '.tag_name' | sed 's/^v//')
          curl -Lo /usr/local/bin/bosh \
            "https://github.com/cloudfoundry/bosh-cli/releases/download/v${BOSH_VERSION}/bosh-cli-${BOSH_VERSION}-linux-amd64"
          chmod +x /usr/local/bin/bosh
          bosh --version

      - name: Configure blobstore credentials
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          cat > config/private.yml <<EOF
          ---
          blobstore:
            provider: s3
            options:
              access_key_id: "${AWS_ACCESS_KEY_ID}"
              secret_access_key: "${AWS_SECRET_ACCESS_KEY}"
          EOF

      - name: Download RustFS binary blob
        run: |
          # The blob key in config/blobs.yml names the RustFS version, for
          # example rustfs/rustfs-linux-x86_64-musl-1.0.3.zip.  The package
          # spec holds only a glob, so it cannot tell us the version.
          BLOB_KEYS=$(grep -E '^rustfs/rustfs-linux-x86_64-musl-[^:]+\.zip:' config/blobs.yml | sed 's/:$//')
          if [ "$(printf '%s\n' "${BLOB_KEYS}" | grep -c .)" -ne 1 ]; then
            echo "config/blobs.yml must list exactly one rustfs musl blob, found: ${BLOB_KEYS:-none}"
            exit 1
          fi
          BLOB_FILE="${BLOB_KEYS#rustfs/}"
          BLOB_VERSION=$(echo "${BLOB_FILE}" | sed -e 's/^rustfs-linux-x86_64-musl-//' -e 's/\.zip$//')
          # Upstream asset names carry a v prefix that the blob key drops.
          ASSET="rustfs-linux-x86_64-musl-v${BLOB_VERSION}.zip"
          BASE_URL="https://github.com/rustfs/rustfs/releases/download/${BLOB_VERSION}"
          echo "Downloading ${BASE_URL}/${ASSET}"
          curl -fLo "/tmp/${BLOB_FILE}" "${BASE_URL}/${ASSET}"

          # Upstream publishes SHA256SUMS with every release, so a missing
          # file or entry fails the build rather than shipping an unverified
          # binary.
          curl -fLo /tmp/SHA256SUMS "${BASE_URL}/SHA256SUMS"
          EXPECTED=$(awk -v asset="${ASSET}" '$2 == asset || $2 == "*" asset {print $1}' /tmp/SHA256SUMS)
          if [ -z "${EXPECTED}" ]; then
            echo "${ASSET} is not listed in the upstream SHA256SUMS"
            exit 1
          fi
          ACTUAL=$(sha256sum "/tmp/${BLOB_FILE}" | awk '{print $1}')
          if [ "${EXPECTED}" != "${ACTUAL}" ]; then
            echo "SHA256 mismatch: expected ${EXPECTED}, got ${ACTUAL}"
            exit 1
          fi
          # config/blobs.yml records the same digest, so the blob we upload
          # is the one the release was built and tested with.
          RECORDED=$(awk -v key="${BLOB_KEYS}:" '$1 == key {found=1; next} found && $1 == "sha:" {sub(/^sha256:/, "", $2); print $2; exit}' config/blobs.yml)
          if [ "${RECORDED}" != "${ACTUAL}" ]; then
            echo "config/blobs.yml records ${RECORDED:-no sha256} for ${BLOB_KEYS}, but upstream serves ${ACTUAL}"
            exit 1
          fi
          echo "SHA256 verified: ${ACTUAL}"

          bosh add-blob "/tmp/${BLOB_FILE}" "rustfs/${BLOB_FILE}"
          bosh upload-blobs

      - name: Create final release
        run: |
          bosh -n create-release --final --version "${{ steps.version.outputs.version }}"

      - name: Create release tarball
        run: |
          bosh -n create-release \
            "releases/rustfs/rustfs-${{ steps.version.outputs.version }}.yml" \
            --tarball "releases/rustfs/rustfs-${{ steps.version.outputs.version }}.tgz"
          sha256sum "releases/rustfs/rustfs-${{ steps.version.outputs.version }}.tgz" \
            > "releases/rustfs/rustfs-${{ steps.version.outputs.version }}.tgz.sha256"

      - name: Commit release index
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases/rustfs/ config/blobs.yml
          git commit -m "Release ${{ steps.version.outputs.version }}" || true
          git push

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "rustfs-boshrelease ${{ steps.version.outputs.version }}"
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            releases/rustfs/rustfs-${{ steps.version.outputs.version }}.tgz
            releases/rustfs/rustfs-${{ steps.version.outputs.version }}.tgz.sha256
